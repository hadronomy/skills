name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or later.
      - run: npm install -g npm@^11
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # Opens or updates the version PR. Merging it bumps package.json,
      # syncs .claude-plugin/plugin.json, and writes CHANGELOG.md.
      # The same step publishes to npm on merge. First release uses a
      # NODE_AUTH_TOKEN secret (npm automation token, see below). After
      # the package exists, add this repo and workflow as a trusted
      # publisher on the package page at npmjs.com then drop the token
      # and rely on OIDC (id-token permission stays for provenance).
      - uses: changesets/action@v1
        with:
          version: bun run version
          commit: "chore: release"
          title: "chore: release"
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
